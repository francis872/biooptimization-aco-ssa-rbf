<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BioOptimization Lab</title><link rel="stylesheet" href="/static/styles.css"></head><body><main><header><p>BIO-INSPIRED COMPUTING</p><h1>BioOptimization Lab</h1><span id="mongo">MongoDB: comprobando...</span></header><section class="grid"><article><h2>ACO · TSP</h2><label>Ciudades <input id="cities" type="number" value="20" min="15"></label><label>Hormigas <input id="ants" type="number" value="30"></label><label>Iteraciones <input id="ait" type="number" value="100"></label><button onclick="runACO()">Ejecutar ACO</button><pre id="aco"></pre></article><article><h2>SSA · Rastrigin</h2><label>Dimensión <input id="dim" type="number" value="10"></label><label>Población <input id="pop" type="number" value="30"></label><label>Iteraciones <input id="sit" type="number" value="100"></label><button onclick="runSSA()">Ejecutar SSA</button><pre id="ssa"></pre></article></section><section><h2>RBF + SSA · experimento principal</h2><p>El pipeline completo de 10 semillas se ejecuta con <code>python main.py</code> y registra las corridas en MongoDB Atlas.</p><p>La colección configurada es <code>biooptimization.runs</code>.</p></section></main><script src="/static/app.js"></script></body></html>
